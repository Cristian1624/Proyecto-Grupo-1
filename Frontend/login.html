
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moto Pro Taller</title>
    <link rel="stylesheet" href="../CSS/styles.css">
</head>


<main class="auth-layout">
    <div class="auth-visual" style="background-image: url('../imagenes/Logo.png');">
        <div class="auth-visual-content">
            <span class="eyebrow">Tu taller de confianza</span>
            <h2>BIENVENIDO</h2>
        </div>
    </div>

    <div class="auth-panel">
        <a href="index.html" class="back-link">← Volver al inicio</a>
        <div class="auth-header">
            <span class="eyebrow">Moto Pro Taller</span>
            <h1>INICIAR SESIÓN</h1>
            <p>Accede a tu cuenta para gestionar tus citas y el historial de servicios.</p>
        </div>

        <form action="dashboard.html">
            <div class="form-group">
                <label class="form-label">Correo electrónico</label>
                <input type="email" class="form-control" placeholder="tu@correo.com" required>
            </div>
            <div class="form-group">
                <label class="form-label">Contraseña</label>
                <input type="password" class="form-control" placeholder="••••••••" required>
            </div>
            <div class="form-helper">
                <a href="#">¿Olvidaste tu contraseña?</a>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Ingresar</button>
        </form>

        <div class="demo-box">
            <div class="demo-box-title">Acceso de demostración</div>
            <a href="dashboard.html" class="btn btn-purple-outline btn-block btn-sm">Entrar como Administrador</a>
        </div>
    </div>
</main>
