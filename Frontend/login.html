<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Iniciar Sesion | Garage Evil </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../CSS/styles.css">
</head>

<body>
    <main class="auth-layout">
    <div class="auth-visual" style="background-image: url(../CSS/img/Logo.png);">
        <div class="auth-visual-content">
            <span class="brown">Tu taller de confianza</span>
            <h2>BIENVENIDO</h2>
        </div>
    </div>

    <div class="auth-panel">
        <a href="index.html" class="back-link"><i class="bi bi-arrow-left me-1"></i> Volver Al Inicio </a>
        <div class="auth-header">
            <span class="eyebrow"> GARAGE EVIL </span>
            <h1>INICIAR SESIÓN</h1>
            <p>Accede a tu cuenta para gestionar tus citas y el historial de servicios</p>
        </div>

        <form action="dashboard.html" method="get">
            <div class="mb-3">
                <label for="LoginCorreo" class="form-label">Correo electrónico</label>
                <input type="email" class="form-control" id="LoginCorreo" placeholder="nombre@gmail.com" required>
            </div>
            <div class="mb-3">
                <label for="LoginPassword" class="form-label"> Contraseña </label>
                <input type="password" class="form-control" id="LoginPassword" placeholder="••••••••" minlength="6" required>
            </div>
            <div class="form-helper">
                <a href="#"> ¿Olvidaste tu contraseña ?</a>
            </div>
            <button type="submit" class="btn btn-primary w-100">
                <i class="bi bi-box-arrow-in-right me-1"></i> Ingresar </button>
        </form>

        <div class="demo-box">
            <div class="demo-box-title text-center"> ¿COMO DESEAS INGRESAR? </div>
            <div class="row row-cols-3 g-2">
                <div class="col">
                    <a href="panel-clientes.html" class="acceso-opcion">
                        <i class="bi bi-person"></i>
                        <small>Entrar Como</small>
                        <span>Cliente</span>
                    </a>
                </div>
                <div class="col">
                    <a href="panel-mecanico.html" class="acceso-opcion">
                        <i class="bi bi-wrench-adjustable"></i>
                        <small> Entrar Como </small>
                        <span> Mecanico </span>
                    </a>
                </div>
                <div class="col">
                    <a href="dashboard.html" class="acceso-opcion">
                        <i class="bi bi-shield-lock"></i>
                        <small>Entrar Como</small>
                        <span>Administrador</span>
                    </a>
                </div>
            </div>
        </div>
    </div>
</main>
    
</body>
</html>
